name: dispatch-engine

# Infra only. Nest apps still run on the host with npm run start:*.
# Host ports: 5432 is left free in case a local Postgres is already running.

services:
  postgres-order:
    image: postgres:16
    container_name: dispatch-postgres-order
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_db
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U order -d order_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dispatch-net

  postgres-dispatch:
    image: postgres:16
    container_name: dispatch-postgres-dispatch
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch_db
    volumes:
      - postgres_dispatch_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispatch -d dispatch_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dispatch-net

  postgres-tracking:
    image: postgres:16
    container_name: dispatch-postgres-tracking
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking
      POSTGRES_DB: tracking_db
    volumes:
      - postgres_tracking_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracking -d tracking_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dispatch-net

  postgres-driver:
    image: postgres:16
    container_name: dispatch-postgres-driver
    restart: unless-stopped
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: driver
      POSTGRES_PASSWORD: driver
      POSTGRES_DB: driver_db
    volumes:
      - postgres_driver_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U driver -d driver_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dispatch-net

  redis:
    image: redis:7-alpine
    container_name: dispatch-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dispatch-net

  kafka:
    image: apache/kafka:3.9.1
    container_name: dispatch-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - dispatch-net

volumes:
  postgres_order_data:
  postgres_dispatch_data:
  postgres_tracking_data:
  postgres_driver_data:
  redis_data:
  kafka_data:

networks:
  dispatch-net:
    driver: bridge
